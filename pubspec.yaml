name: text_snap_ocr
description: TextSnap OCR - Offline English OCR (ML Kit) + Urdu OCR via Gemini API.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_mlkit_text_recognition: ^0.14.0
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  google_fonts: ^6.2.1
  http: ^1.2.0
  flutter_dotenv: ^5.1.0
  flutter_animate: ^4.5.0
  flutter_native_splash: ^2.4.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#F8FAFF"
  image: "icon.png"
  android: true
  ios: false
  android_12:
    image: "icon.png"
    color: "#F8FAFF"

flutter:
  uses-material-design: true
  assets:
    - .env

